# Printer pack: Wizard Labels (public example).
# Confirmed: safe margin, bleed, outlined fonts (prepress email), bleed present in
# the PDF, CMYK only. (No required elements: a lot box is a client design element, not a
# printer rule; the required_elements rule for lot_box was removed 2026-10-01.)
# The die size is per job, not per printer: pass it at run time
# (sla-preflight run ... --die 10.25x2.5).
pack: printer/wizard_labels.yaml
kind: printer
description: Artwork requirements for Wizard Labels roll labels.
rules:
  - id: safe_margin
    description: All non-bleed content at least this far inside the die line (trim).
    min_gap_in: 0.0625
    bleed_allowed: [bg_band, bar_top, bar_bottom, lot_box]
    source: "Wizard Labels prepress email, 2026-06-04"
    verified: true
    verified_by: Darius
    verified_on: 2026-09-28

  - id: bleed
    description: Document bleed on every side.
    bleed_in: 0.0625
    tolerance_in: 0.001
    source: "Wizard Labels prepress email, 2026-06-04"
    verified: true
    verified_by: Darius
    verified_on: 2026-09-28

  - id: pdf_fonts
    description: The final PDF has no live fonts; all text outlined.
    fonts_outlined: true
    source: "Wizard Labels prepress email, 2026-06-04"
    verified: true
    verified_by: Darius
    verified_on: 2026-09-28

  - id: pdf_bleed
    description: The final PDF includes the document bleed on every side (print-ready).
    required: true
    tolerance_in: 0.001
    source: "Owner confirmation: final PDFs must be print-ready, 2026-09-28"
    verified: true
    verified_by: repo owner
    verified_on: 2026-09-28

  - id: pdf_color
    description: The final PDF uses CMYK only; no RGB content.
    color_space: CMYK
    source: "Owner confirmation: CMYK / print-ready required, 2026-09-28"
    verified: true
    verified_by: repo owner
    verified_on: 2026-09-28
